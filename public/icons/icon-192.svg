<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" stroke="#1E293B" stroke-width="6"/>

  <!-- Scanning Reticle Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner Brackets -->
  <path d="M 80 140 L 80 80 L 140 80" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 432 140 L 432 80 L 372 80" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 80 372 L 80 432 L 140 432" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 432 372 L 432 432 L 372 432" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>

  <!-- Stylized Biometric Human Skeleton Nodes & Connections -->
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="256" cy="130" r="28" fill="none" stroke="url(#primary)" stroke-width="6"/>
    <!-- Spine / Torso -->
    <line x1="256" y1="158" x2="256" y2="280" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Shoulders -->
    <line x1="180" y1="195" x2="332" y2="195" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="180" y1="195" x2="150" y2="270" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="270" x2="135" y2="340" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>
    <line x1="332" y1="195" x2="362" y2="270" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>
    <line x1="362" y1="270" x2="377" y2="340" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>

    <!-- Pelvis -->
    <line x1="205" y1="280" x2="307" y2="280" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs -->
    <line x1="210" y1="280" x2="195" y2="365" stroke="url(#primary)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="195" y1="365" x2="185" y2="440" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>
    <line x1="302" y1="280" x2="317" y2="365" stroke="url(#primary)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="317" y1="365" x2="327" y2="440" stroke="url(#primary)" stroke-width="4" stroke-linecap="round"/>

    <!-- Key Joint Nodes -->
    <circle cx="256" cy="130" r="6" fill="#38BDF8" />
    <circle cx="180" cy="195" r="7" fill="#38BDF8" />
    <circle cx="332" cy="195" r="7" fill="#38BDF8" />
    <circle cx="150" cy="270" r="6" fill="#10B981" />
    <circle cx="362" cy="270" r="6" fill="#10B981" />
    <circle cx="135" cy="340" r="5" fill="#38BDF8" />
    <circle cx="377" cy="340" r="5" fill="#38BDF8" />
    <circle cx="210" cy="280" r="6" fill="#38BDF8" />
    <circle cx="302" cy="280" r="6" fill="#38BDF8" />
    <circle cx="195" cy="365" r="6" fill="#10B981" />
    <circle cx="317" cy="365" r="6" fill="#10B981" />
    <circle cx="185" cy="440" r="5" fill="#38BDF8" />
    <circle cx="327" cy="440" r="5" fill="#38BDF8" />
  </g>
</svg>
